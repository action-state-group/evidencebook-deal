name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly: every case under the race detector (see the tests job's env).
    - cron: '0 6 * * *'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'schedule' && 'nightly' || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Refuse committed env files
        run: |
          tracked="$(git ls-files)"
          bad="$(printf '%s\n' "$tracked" | grep -E '(^|/)\.env($|\.)' | grep -vE '\.example$' || true)"
          if [ -n "$bad" ]; then
            printf '::error::env file(s) committed; remove them from the repository and rotate any secret they held:\n%s\n' "$bad"
            exit 1
          fi
      - name: Check formatting and module files
        run: |
          test -z "$(gofmt -l .)"
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: capsule-cli is required at a version, never replaced
        # The plugin embeds the core it is built with (capsule-cli#326,
        # design note section 4.2), so a build from a local checkout is not
        # one this repository ships.
        run: |
          if grep -n '^replace\|=> ' go.mod; then
            echo "::error::go.mod replaces a module; require it at a version instead"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: The confusables table matches its generator
        run: |
          go generate ./internal/deal
          git diff --exit-code -- internal/deal/confusables_table.go
      - name: Build the plugin
        run: go build -o capsulectl-deal ./cmd/capsulectl-deal
      - name: The release build, dry run
        # The release workflow's build and handshake check (RELEASING.md), so the
        # first real release is not the first run of either.
        run: |
          scripts/release-build.sh v0.0.0-ci "$GITHUB_SHA" "$RUNNER_TEMP/dist"
          meta="$("$RUNNER_TEMP/dist/capsulectl-deal-v0.0.0-ci-linux-amd64" cli-plugin-metadata)"
          core=$(go list -m -f '{{.Version}}' github.com/action-state-group/capsule-cli)
          test "$(jq -r .version <<<"$meta")" = v0.0.0-ci || { echo "unexpected version: $meta"; exit 1; }
          test "$(jq -r .core_version <<<"$meta")" = "$core" || { echo "unexpected core_version: $meta"; exit 1; }
          (cd "$RUNNER_TEMP/dist" && sha256sum -c SHA256SUMS)

  tests:
    # The race detector split by test name across six jobs, and every case
    # without it across two (scripts/test.sh), as in capsule-cli, where the
    # deal package outgrew one race job's 15 minutes (capsule-cli#403, #407).
    strategy:
      fail-fast: false
      matrix:
        part:
          - { pass: race, shard: 1/6 }
          - { pass: race, shard: 2/6 }
          - { pass: race, shard: 3/6 }
          - { pass: race, shard: 4/6 }
          - { pass: race, shard: 5/6 }
          - { pass: race, shard: 6/6 }
          - { pass: plain, shard: 1/2 }
          - { pass: plain, shard: 2/2 }
    name: test (${{ matrix.part.pass }} ${{ matrix.part.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CAPSULE_TEST_RACE_FULL: ${{ github.event_name == 'schedule' && '1' || '' }}
      CAPSULE_TEST_PASS: ${{ matrix.part.pass }}
      CAPSULE_TEST_SHARD: ${{ matrix.part.shard }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Tests (${{ matrix.part.pass }}, shard ${{ matrix.part.shard }})
        run: bash scripts/test.sh

  test:
    # One result to require in branch protection.
    if: always()
    needs: [tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Tests passed
        run: test "${{ needs.tests.result }}" = success

  deal-pages:
    # A deal receipt's page in headless Chrome (scripts/check-deal-pages.sh),
    # then the presentation goldens re-emitted and measured at 390px, 1280px
    # and in print in the pinned Chrome and fonts (internal/deal/
    # presentation_golden_test.go, testdata/presentation/known-overflow.json).
    name: deal pages render and check themselves
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: A deal receipt's page
        env:
          CHROME: google-chrome
        run: bash scripts/check-deal-pages.sh
      - name: Set up the pinned Chrome
        id: chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: 155.0.8059.39
          install-dependencies: true
      - name: Install the pinned fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends fonts-dejavu-core fontconfig
          FONTCONFIG_FILE="$GITHUB_WORKSPACE/testdata/presentation/fonts.conf" fc-list : family | sort -u
      - name: Presentation goldens
        env:
          CAPSULECTL_CHROME: ${{ steps.chrome.outputs.chrome-path }}
          CAPSULECTL_PRESENTATION_PINNED: "1"
          CAPSULECTL_PRESENTATION_RENDERS: ${{ runner.temp }}/presentation-renders
          FONTCONFIG_FILE: ${{ github.workspace }}/testdata/presentation/fonts.conf
        run: go test -count=1 -v -run 'TestPresentation|TestOverflowBaselineCheck' -skip '^TestPresentationPass' ./internal/deal
      - name: Keep the presentation renders
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: presentation-renders
          path: ${{ runner.temp }}/presentation-renders
          if-no-files-found: ignore

  portability:
    # A deal's shared copy and exported records stand on their own
    # (capsule-cli#243): see scripts/check-portability.sh.
    name: shared deal copy verifies without the session
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Deal, share, export, delete the session, verify offline
        env:
          CHROME: google-chrome
        run: bash scripts/check-portability.sh

  presentation-pass:
    # The presentation goldens' bundles through `presentation list` and
    # `presentation build` (internal/deal/presentation_pass_test.go), each
    # page opened at 390px, 1280px and in print in the pinned Chrome and
    # fonts, compared semantically.
    name: presentation pass (390px, 1280px, print)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up the pinned Chrome
        id: chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: 155.0.8059.39
          install-dependencies: true
      - name: Install the pinned fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends fonts-dejavu-core fontconfig
      - name: Presentation pass
        env:
          CAPSULECTL_CHROME: ${{ steps.chrome.outputs.chrome-path }}
          CAPSULECTL_PRESENTATION_PINNED: "1"
          FONTCONFIG_FILE: ${{ github.workspace }}/testdata/presentation/fonts.conf
        run: go test -count=1 -p 1 -v -timeout 10m -run '^TestPresentationPass' ./internal/deal

  interop-at-resolved-versions:
    # evidencebook's own CI runs this Go <-> Python round trip against its
    # pins; this plugin links the versions this go.mod resolves (minimal
    # version selection), so the round trip runs with those here
    # (scripts/interop-resolved.sh).
    name: interop at the resolved versions (Go <-> Python)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: The evidencebook version this module resolves
        id: resolved
        run: |
          version=$(go list -m -f '{{.Version}}' github.com/action-state-group/evidencebook)
          commit=$(go mod download -json "github.com/action-state-group/evidencebook@$version" | jq -er '.Origin.Hash')
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]] || exit 1
          echo "evidencebook=$commit" >> "$GITHUB_OUTPUT"
      - name: Check out evidencebook at that version (its Python verifier scripts)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: action-state-group/evidencebook
          ref: ${{ steps.resolved.outputs.evidencebook }}
          path: .interop/evidencebook
      - name: Check out Python CLL (as evidencebook's CI pins it)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: action-state-group/checkpointed-local-log
          ref: 88e99d405241aee790f6795fda612527679114ba
          path: .interop/checkpointed-local-log
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install Python CLL, the AAC bundle verifier and capsule-emit (locked, with hashes)
        run: |
          python -m pip install --no-deps ./.interop/checkpointed-local-log
          python -m pip install --require-hashes -r scripts/interop-requirements.txt
          python -m pip check
      - name: The round trip, both ways, with the tampered copies refused
        run: bash scripts/interop-resolved.sh .interop/evidencebook

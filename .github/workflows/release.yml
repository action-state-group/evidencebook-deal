name: Release

# Builds capsulectl-deal for linux/amd64, linux/arm64 and darwin/arm64, and the
# deal skill's archive, when a v* tag is pushed, and attaches them plus
# SHA256SUMS to the GitHub release for that tag. The build is
# scripts/release-build.sh, so a tag can be rebuilt with the same Go version
# (and GNU tar, for the skill archive) and compared against SHA256SUMS. The
# assets get a GitHub build provenance attestation (Sigstore, keyless),
# verifiable with
#   gh attestation verify FILE --repo action-state-group/evidencebook-deal \
#     --signer-workflow action-state-group/evidencebook-deal/.github/workflows/release.yml
# and the attestation bundle is published as capsulectl-deal-<version>.sigstore.json,
# so the same check runs with no GitHub account (add --bundle).
#
# The plugin embeds the capsulectl core it builds against (capsule-cli#326,
# design note section 4.2), so a release requires capsule-cli at a published
# release, never a replace, and its handshake must report that release as
# core_version and this tag as version.
#
# Nothing is published until a person approves the run, in the environments
# scripts/release-settings.sh sets: `release` for a full release, where
# whoever pushed the tag cannot approve it, and `release-candidate` for a
# pre-release. Every Action is pinned by commit SHA.

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ contains(github.ref_name, '-') && 'release-candidate' || 'release' }}
    permissions:
      contents: write
      id-token: write # OIDC token for the build provenance attestation
      attestations: write
    steps:
      - name: Refuse a full release re-run by someone else
        # Prevent self-review stops whoever started a run from approving it,
        # and a re-run is started by whoever re-ran it. The tag's pusher could
        # then approve their own full release, so that run stops here, before
        # anything is built (RELEASING.md).
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          test "$ACTOR" = "$TRIGGERING_ACTOR" \
            || { echo "$GITHUB_REF_NAME was pushed by $ACTOR but this run was started by $TRIGGERING_ACTOR: have $ACTOR re-run it"; exit 1; }
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Check the tag is a version a shared copy keeps
        # Sealed records name this tag as their producer's version, and a
        # shared deal copy keeps a producer only in a fixed shape
        # (producerVersion in internal/deal/deal_share.go; the test
        # TestReleaseTagPolicyIsTheProducerShape keeps the two equal).
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          printf '%s\n' "$VERSION" | grep -Eqx 'v[0-9]{1,4}\.[0-9]{1,4}\.[0-9]{1,4}(-(rc|alpha|beta|dev)[0-9]{0,3})?' \
            || { echo "tag $VERSION is not a version a shared copy keeps (vN.N.N, up to four digits each, optionally followed by -rc, -alpha, -beta or -dev and up to three digits)"; exit 1; }
      - name: The core this plugin pairs with is a published capsule-cli release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if grep -n '^replace\|=> ' go.mod; then
            echo "go.mod replaces a module: a release requires capsule-cli at a release"; exit 1
          fi
          core=$(go list -m -f '{{.Version}}' github.com/action-state-group/capsule-cli)
          printf '%s\n' "$core" | grep -Eqx 'v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?' \
            || { echo "go.mod requires capsule-cli at $core, not a release tag"; exit 1; }
          # A release takes the version of the capsulectl release it pairs
          # with (RELEASING.md).
          test "$GITHUB_REF_NAME" = "$core" \
            || { echo "tag $GITHUB_REF_NAME is not $core, the capsule-cli release go.mod requires: a capsulectl-deal release takes its core's version"; exit 1; }
          draft=$(gh release view "$core" --repo action-state-group/capsule-cli --json isDraft --jq .isDraft) \
            || { echo "capsule-cli has no release $core"; exit 1; }
          test "$draft" = false || { echo "capsule-cli $core is not published"; exit 1; }
          echo "CORE_VERSION=$core" >> "$GITHUB_ENV"
      - name: Vet
        run: go vet ./...
      - name: Build release assets
        env:
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: scripts/release-build.sh "$VERSION" "$COMMIT" dist
      - name: Check the versions the plugin reports
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          meta="$(dist/capsulectl-deal-"$VERSION"-linux-amd64 cli-plugin-metadata)"
          test "$(jq -r .version <<<"$meta")" = "$VERSION" || { echo "unexpected version: $meta"; exit 1; }
          test "$(jq -r .core_version <<<"$meta")" = "$CORE_VERSION" || { echo "unexpected core_version: $meta"; exit 1; }
      - name: Attest build provenance of the assets
        id: attest
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            dist/capsulectl-deal-*
            dist/deal-skill-*
      - name: Attach the attestation bundle
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          VERSION: ${{ github.ref_name }}
        run: |
          cp "$BUNDLE" "dist/capsulectl-deal-$VERSION.sigstore.json"
          (cd dist && sha256sum "capsulectl-deal-$VERSION.sigstore.json" >> SHA256SUMS)
      - name: Publish GitHub release
        # A tag with a hyphen (v0.1.0-rc4, v1.0.0-beta1) is a pre-release:
        # published as such and never marked the latest release. gh creates
        # the release as a draft, uploads, then publishes, which immutable
        # releases allow. A draft left by a run that died mid-upload is
        # finished here; a published release is never changed.
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          flags=()
          case "$VERSION" in
            *-*) flags=(--prerelease --latest=false) ;;
          esac
          if draft="$(gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [ "$draft" != true ]; then
              echo "release $VERSION is already published and final: the capsulectl release it pairs with has its capsulectl-deal release"
              exit 1
            fi
            gh release upload "$VERSION" dist/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false "${flags[@]}"
          else
            gh release create "$VERSION" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag "${flags[@]}" \
              --title "capsulectl-deal $VERSION" \
              --notes "Prebuilt capsulectl-deal plugin binaries (linux/amd64, linux/arm64, darwin/arm64) and the deal skill archive. Pairs with capsulectl $CORE_VERSION. Verify with: sha256sum -c SHA256SUMS. Check the build attestation with no GitHub account: gh attestation verify FILE --bundle capsulectl-deal-$VERSION.sigstore.json --repo $GITHUB_REPOSITORY --signer-workflow $GITHUB_REPOSITORY/.github/workflows/release.yml"
          fi
